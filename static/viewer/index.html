<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  资料在线预览（/viewer/?file=/documents/xxx.pdf）。说明见 static/viewer/README.md。
  与 /admin/ 同源（那里可能在 localStorage 里记住了 GitHub 令牌），所以这里：只加载本站脚本、没有内联脚本、
  不读写 localStorage（只读主题偏好 pref-theme）、只打开本站 /documents/ 等目录下的文件。
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'none'; frame-src 'none'; child-src 'none'; manifest-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<title>资料预览</title>
<link rel="icon" href="../favicon.jpg">
<link rel="stylesheet" href="viewer.css">
<script src="theme.js"></script>
<script type="module" src="viewer.js"></script>
<script nomodule src="nomodule.js"></script>
</head>
<body>
<header class="bar" id="bar">
  <a class="bar-home" id="home" href="../" data-i18n-title="home">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>
    <span class="bar-site" id="site-name" data-i18n="home">主页</span>
  </a>
  <div class="bar-file" id="file-name" title=""></div>
  <div class="bar-tools">
    <div class="pager" id="pager" hidden>
      <input id="page-input" class="pager-input" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="go" value="1" data-i18n-title="pageInput">
      <span class="pager-sep">/</span>
      <span id="page-count">1</span>
    </div>
    <div class="zoom" id="zoom" hidden>
      <button type="button" class="btn btn-icon" id="zoom-out" data-i18n-title="zoomOut">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
      </button>
      <span class="zoom-label" id="zoom-label">100%</span>
      <button type="button" class="btn btn-icon" id="zoom-in" data-i18n-title="zoomIn">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>
      </button>
      <button type="button" class="btn btn-icon" id="zoom-fit" data-i18n-title="fitWidth">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7 3 12l5 5M16 7l5 5-5 5M3 12h18"/></svg>
      </button>
    </div>
    <a class="btn btn-text" id="open-new" target="_blank" rel="noopener" data-i18n-title="openNew" hidden>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
      <span data-i18n="openNew">在新页面打开</span>
    </a>
    <a class="btn btn-primary" id="download" hidden>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
      <span data-i18n="download">下载</span>
    </a>
  </div>
  <div class="progress" id="progress" hidden><div class="progress-fill" id="progress-fill"></div></div>
</header>
<main class="main" id="main">
  <div class="pages" id="pages"></div>
  <div class="status" id="status" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <p class="status-title" id="status-title" data-i18n="loading">正在加载…</p>
  </div>
</main>
</body>
</html>

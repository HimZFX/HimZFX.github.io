# ============================================================
# ★ 双语共享机制
#
# 同一个 content/ 目录被同时挂载给每一种语言，于是：
#
#   xxx.md      没有语言后缀 → 共用版本，中英文站都会显示
#   xxx.en.md   英文专属版本 → 存在时，英文站用它替换 xxx.md
#   xxx.zh.md   中文专属版本 → 存在时，中文站用它替换 xxx.md
#
# 平时只写一份 xxx.md，两个语言站点就都有这篇；
# 哪天补了 xxx.en.md，英文站自动换成英文版，中文站仍显示 xxx.md，
# 两者自动互为翻译（语言切换、hreflang 都会正确关联）。
#
# 这是 Hugo 原生行为：带语言后缀的文件总是优先于共用文件，
# 与下面挂载的先后顺序无关。完整说明见 SITE_GUIDE.md「双语机制」。
#
# 以后新增语言（如 ja）时：在 languages.toml 加上该语言，
# 再在这里照样加一条 lang = "ja" 的挂载即可。
# ============================================================

[[mounts]]
  source = "content"
  target = "content"
  lang = "zh"

[[mounts]]
  source = "content"
  target = "content"
  lang = "en"
